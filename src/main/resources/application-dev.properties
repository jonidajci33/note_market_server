spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/note_seller}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.schema=note_seller

app.security.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me}
app.security.open-seller-registration=${OPEN_SELLER_REGISTRATION:true}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/local
spring.flyway.schemas=note_seller
spring.flyway.default-schema=note_seller
spring.flyway.init-sqls[0]=CREATE SCHEMA IF NOT EXISTS note_seller;
spring.flyway.init-sqls[1]=SET search_path TO note_seller;


app.storage.s3.enabled=${S3_ENABLED:true}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.public-endpoint=${S3_PUBLIC_ENDPOINT:}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.bucket=${S3_BUCKET:notes}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}

logging.level.notes.seller.service=INFO
