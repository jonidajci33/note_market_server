spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.schema=note_seller

app.security.jwt.secret=change-me-change-me-change-me-change-me
app.security.open-seller-registration=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/local
spring.flyway.schemas=note_seller
spring.flyway.default-schema=note_seller
spring.flyway.create-schemas=true

app.storage.s3.enabled=true
app.storage.s3.endpoint=http://localhost:9000
app.storage.s3.region=us-east-1
app.storage.s3.bucket=notes
app.storage.s3.access-key=minioadmin
app.storage.s3.secret-key=minioadmin
