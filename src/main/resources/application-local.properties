spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.hikari.schema=note_seller

app.security.jwt.secret=change-me-change-me-change-me-change-me
app.security.open-seller-registration=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/local
spring.flyway.schemas=note_seller
spring.flyway.default-schema=note_seller
spring.flyway.init-sqls[0]=CREATE SCHEMA IF NOT EXISTS note_seller;
spring.flyway.init-sqls[1]=SET search_path TO note_seller;

app.storage.local.enabled=true
app.storage.local.root-dir=${LOCAL_STORAGE_ROOT:./.storage-local}
app.storage.local.public-base-url=${LOCAL_STORAGE_PUBLIC_BASE_URL:http://{request-host}:{request-port}}
app.storage.local.upload-expiration=${LOCAL_STORAGE_UPLOAD_EXPIRATION:PT15M}
app.storage.local.download-expiration=${LOCAL_STORAGE_DOWNLOAD_EXPIRATION:PT15M}

app.storage.s3.enabled=false
app.storage.s3.endpoint=
app.storage.s3.public-endpoint=
app.storage.s3.region=us-east-1
app.storage.s3.bucket=
app.storage.s3.access-key=
app.storage.s3.secret-key=
